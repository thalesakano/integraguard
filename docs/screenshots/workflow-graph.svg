  <rect x="24" y="390" width="912" height="126" rx="12" fill="#1a2332" stroke="#2d3a4f"/>
  <text x="40" y="418" fill="#e7ecf3" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Adaptive loop (after first 400)</text>
  <text x="40" y="444" fill="#8b9cb3" font-family="ui-monospace,monospace" font-size="11">1) POST body {} → 400 {"error":"sku is required"}</text>
  <text x="40" y="468" fill="#8b9cb3" font-family="ui-monospace,monospace" font-size="11">2) result-analyst → probe-designer counterprobe</text>
  <text x="40" y="492" fill="#22c55e" font-family="ui-monospace,monospace" font-size="11">3) POST {"sku":"&lt;probe&gt;"} → drift required-field-added</text>
